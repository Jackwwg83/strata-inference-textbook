name: textbook checks
on: [push, pull_request]
jobs:
  content-and-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s labs -p 'test_*.py' -v
